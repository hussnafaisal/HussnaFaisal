<path d="M88 31.5 H1112" stroke="#fff" stroke-opacity="0.55" stroke-width="1.5" stroke-linecap="round"/><text x="100" y="82" font-size="26" font-weight="700" fill="#fff" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">About me</text><circle cx="104" cy="115" r="4" fill="#9be7c4"/><text x="122" y="120" font-size="18" fill="#dfe6ff" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">Frontend developer and UI/UX designer who loves clean, modern, interactive interfaces.</text><circle cx="104" cy="145" r="4" fill="#9be7c4"/><text x="122" y="150" font-size="18" fill="#dfe6ff" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">Sketch artist, so small design details matter to me.</text><circle cx="104" cy="175" r="4" fill="#9be7c4"/><text x="122" y="180" font-size="18" fill="#dfe6ff" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">Studying BSCS at Virtual University, based in Faisalabad, Punjab, Pakistan.</text><circle cx="104" cy="205" r="4" fill="#9be7c4"/><text x="122" y="210" font-size="18" fill="#dfe6ff" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">Open to internships and collaborations.</text>
